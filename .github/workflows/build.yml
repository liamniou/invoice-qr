name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: version
        # Dependabot-bumpable tag (YYYY.M.D.run) for gitops pins.
        run: echo "tag=$(date -u +%Y.%-m.%-d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/liamniou/invoice-qr:latest
            ghcr.io/liamniou/invoice-qr:${{ steps.version.outputs.tag }}

      - name: Output image digest
        run: echo "IMAGE_DIGEST=${{ steps.push.outputs.digest }}"
